  <path d="M92 60c6 10 9 20 7 30M120 54v34M148 60c-6 10-9 20-7 30" stroke="#8C86A6" stroke-width="6" fill="none" stroke-linecap="round" opacity=".75"/>
  <path d="M40 120c8 2 14 6 18 12M200 120c-8 2-14 6-18 12" stroke="#8C86A6" stroke-width="5" fill="none" stroke-linecap="round" opacity=".6"/>
  <ellipse cx="120" cy="146" rx="42" ry="30" fill="url(#lMuzzle)"/>
  <!-- stitched seam -->
  <path d="M168 62c14 12 22 32 22 54" stroke="#fff" stroke-opacity=".8" stroke-width="2.2" stroke-dasharray="4 4" fill="none" stroke-linecap="round"/>
  <!-- cheeks -->
  <circle cx="72" cy="148" r="17" fill="url(#lBlush)"/><circle cx="168" cy="148" r="17" fill="url(#lBlush)"/>
  <!-- eyes -->
  <g><circle cx="88" cy="116" r="18" fill="#22302A"/><circle cx="88" cy="116" r="14" fill="url(#lIris)"/><ellipse cx="88" cy="117" rx="5" ry="9" fill="#0D1511"/>
    <circle cx="82" cy="109" r="5.2" fill="#fff"/><circle cx="94" cy="124" r="2.4" fill="#fff" opacity=".9"/></g>
  <g><circle cx="152" cy="116" r="18" fill="#22302A"/><circle cx="152" cy="116" r="14" fill="url(#lIris)"/><ellipse cx="152" cy="117" rx="5" ry="9" fill="#0D1511"/>
    <circle cx="146" cy="109" r="5.2" fill="#fff"/><circle cx="158" cy="124" r="2.4" fill="#fff" opacity=".9"/></g>
  <!-- nose, mouth, whiskers -->
  <path d="M112 140h16l-8 9z" fill="#F08AA0"/><ellipse cx="117" cy="141.5" rx="3" ry="1.6" fill="#fff" opacity=".55"/>
