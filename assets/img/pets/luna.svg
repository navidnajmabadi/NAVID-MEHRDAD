<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Luna, a plush tabby cat">
  <defs>
    <radialGradient id="lHead" cx="38%" cy="28%" r="80%"><stop offset="0" stop-color="#E6E3F0"/><stop offset=".55" stop-color="#C5C1D6"/><stop offset="1" stop-color="#9E99B5"/></radialGradient>
    <radialGradient id="lMuzzle" cx="45%" cy="30%" r="75%"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#ECE9F4"/></radialGradient>
    <radialGradient id="lBlush" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FF9FB4" stop-opacity=".85"/><stop offset="1" stop-color="#FF9FB4" stop-opacity="0"/></radialGradient>
    <radialGradient id="lIris" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#9FD3A0"/><stop offset="1" stop-color="#3F7C4E"/></radialGradient>
    <linearGradient id="lCollar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5B8DFF"/><stop offset="1" stop-color="#2E6AFF"/></linearGradient>
    <radialGradient id="lShadow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#000" stop-opacity=".22"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse cx="120" cy="226" rx="78" ry="9" fill="url(#lShadow)"/>
  <!-- ears -->
  <path d="M44 30c-4 4-14 36-8 66 22-6 40-18 52-34C74 44 58 32 44 30z" fill="url(#lHead)"/>
  <path d="M196 30c4 4 14 36 8 66-22-6-40-18-52-34 14-18 30-30 44-32z" fill="url(#lHead)"/>
  <path d="M50 46c-2 3-8 22-5 40 12-4 22-10 30-20-8-10-16-17-25-20z" fill="#F6B5C4"/>
  <path d="M190 46c2 3 8 22 5 40-12-4-22-10-30-20 8-10 16-17 25-20z" fill="#F6B5C4"/>
