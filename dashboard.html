<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Owner dashboard — PetFinder</title>
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
</head>
<body>
<div class="page">
  <a class="link" href="index.html">&larr; Back</a>
  <h1>Owner dashboard</h1>

  <form id="loginForm" class="card">
    <h2 style="margin-top:0">Log in</h2>
    <label>Username</label>
    <input id="username" required />
    <label>Password</label>
    <input id="password" type="password" required />
    <button type="submit" class="btn-primary">Log in</button>
  </form>

  <div id="app" style="display:none">
    <div class="card">
      <h2 style="margin-top:0">Scan activity</h2>
      <div id="events"></div>
    </div>
    <div class="card" id="mapCard" style="display:none">
      <h2 style="margin-top:0">Live location</h2>
      <div id="map"></div>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
let currentOwnerId = null;
let map = null;
let marker = null;
let pollTimer = null;

document.getElementById("loginForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;
  const owner = Store.findOwnerByUsername(username);

  if (!owner || owner.password !== password) {
    alert("No match in this browser's demo data. Register a pet first.");
    return;
  }

  currentOwnerId = owner.id;
  document.getElementById("loginForm").style.display = "none";
  document.getElementById("app").style.display = "block";
  renderEvents();
  pollTimer = setInterval(renderEvents, 3000);
});

function petName(petId) {
  const pet = Store.getPet(petId);
  return pet ? pet.name : "Unknown pet";
}

function renderEvents() {
  const events = Store.eventsByOwner(currentOwnerId);
  const el = document.getElementById("events");

  if (events.length === 0) {
    el.innerHTML = `<p class="sub" style="margin:0">No scans yet. Ask someone to scan your pet's QR code and opt in to sharing.</p>`;
  } else {
    el.innerHTML = events.map(evt => `
      <div class="notice" style="display:flex; justify-content:space-between; align-items:center">
        <div>
          <strong>${petName(evt.petId)}</strong> — ${evt.mode === "live" ? "live sharing" : "one-time location"}
          <br><span style="font-size:12px">${new Date(evt.createdAt).toLocaleString()}</span>
        </div>
        <span class="pill ${evt.active ? "pill-live" : "pill-off"}">${evt.active ? "LIVE" : "ended"}</span>
      </div>
    `).join("");
  }

  const liveEvent = events.find(e => e.mode === "live" && e.active);
  const mapCard = document.getElementById("mapCard");

  if (liveEvent) {
    mapCard.style.display = "block";
    if (!map) {
      map = L.map("map").setView([liveEvent.lat, liveEvent.lng], 15);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors",
      }).addTo(map);
      marker = L.marker([liveEvent.lat, liveEvent.lng]).addTo(map)
        .bindPopup(`${petName(liveEvent.petId)} found near here`).openPopup();
    } else {
      marker.setLatLng([liveEvent.lat, liveEvent.lng]);
      map.panTo([liveEvent.lat, liveEvent.lng]);
    }
    setTimeout(() => map.invalidateSize(), 0);
  } else {
    mapCard.style.display = "none";
  }
}
</script>
</body>
</html>
