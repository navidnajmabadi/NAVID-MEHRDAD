<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Nakilab — Choose a design</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#000000" />
<meta name="color-scheme" content="dark" />
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet" />
<style>
:root { --text: #F5F5F7; --muted: #A1A1AA; --line: rgba(255,255,255,.1); --blue: #3B82F6; --blue-hi: #7FB2FF; --ease: cubic-bezier(.16,1,.3,1); }
* { box-sizing: border-box; margin: 0; }
body { min-height: 100svh; background: #000; color: var(--muted); font: 400 17px/1.6 "DM Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; display: grid; place-items: center; padding: 48px 20px; }
main { width: 100%; max-width: 1100px; }
header { display: flex; flex-direction: column; gap: 20px; margin-bottom: 48px; }
header img { width: 160px; height: auto; }
h1 { font: 600 clamp(36px, 5vw, 60px)/1.05 "Space Grotesk", sans-serif; letter-spacing: -0.035em; color: var(--text); }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
a.opt { position: relative; display: flex; flex-direction: column; gap: 10px; padding: 28px; min-height: 260px; border-radius: 22px; border: 1px solid var(--line); background: rgba(255,255,255,.04); text-decoration: none; overflow: hidden; transition: border-color .3s, transform .4s var(--ease); }
a.opt:hover { border-color: rgba(127,178,255,.5); transform: translateY(-4px); }
a.opt:focus-visible { outline: 2px solid var(--blue-hi); outline-offset: 3px; }
.letter { font: 600 14px/1 "Space Grotesk", sans-serif; letter-spacing: .16em; color: var(--blue-hi); }
a.opt h2 { font: 600 34px/1.1 "Space Grotesk", sans-serif; letter-spacing: -0.03em; color: var(--text); }
a.opt p { color: var(--muted); }
a.opt .go { margin-top: auto; color: var(--text); font-weight: 500; }
.art { position: absolute; right: -40px; top: -40px; width: 180px; height: 180px; border-radius: 50%; opacity: .55; pointer-events: none; }
.a .art { background: radial-gradient(circle at 35% 30%, #d6e4ff, #3b82f6 26%, #0b1530 60%, transparent 72%); box-shadow: 0 0 0 18px rgba(127,178,255,.06); }
.b .art { border: 2px solid #c8dcff; box-shadow: 0 0 40px rgba(127,178,255,.5), inset 0 0 40px rgba(127,178,255,.3); }
.c .art { background: radial-gradient(circle, rgba(127,178,255,.9) 1px, transparent 1.6px) 0 0 / 9px 9px; -webkit-mask: radial-gradient(closest-side, #000 60%, transparent); mask: radial-gradient(closest-side, #000 60%, transparent); }
@media (max-width: 860px) { .grid { grid-template-columns: 1fr; } a.opt { min-height: 200px; } }
@media (prefers-reduced-motion: reduce) { a.opt { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <img src="assets/nakilab-logo-white.png" alt="Nakilab" width="250" height="47" />
    <h1>Pick the Nakilab look.</h1>
  </header>
  <div class="grid">
    <a class="opt a" href="orbit.html"><span class="art" aria-hidden="true"></span><span class="letter">OPTION A</span><h2>Orbit</h2><p>Planets, orbits and moons.</p><span class="go">Open →</span></a>
    <a class="opt b" href="monolith.html"><span class="art" aria-hidden="true"></span><span class="letter">OPTION B</span><h2>Monolith</h2><p>Metal K, portals and grid floors.</p><span class="go">Open →</span></a>
    <a class="opt c" href="particles.html"><span class="art" aria-hidden="true"></span><span class="letter">OPTION C</span><h2>Particles</h2><p>Living fields of light.</p><span class="go">Open →</span></a>
  </div>
</main>
</body>
</html>
