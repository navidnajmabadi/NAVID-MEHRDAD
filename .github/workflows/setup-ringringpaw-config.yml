# One-time / on-demand: write RingRingPaw config on Hostinger OUTSIDE the web root.
# Does NOT commit secrets. Never logs DB password or file contents.
#
# Required repo secrets:
#   HOSTINGER_SSH_KEY  — deploy private key (same as Deploy RingRingPaw)
#   RRP_DB_NAME        — MySQL database name
#   RRP_DB_USER        — MySQL user
#   RRP_DB_PASS        — MySQL password
# Optional:
#   RRP_MAIL_FROM      — defaults to noreply@nakilab.com if unset/empty
#
# Run: Actions → "Setup RingRingPaw config" → Run workflow
name: Setup RingRingPaw config

on:
  workflow_dispatch:

jobs:
  write-config:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          RRP_DB_NAME: ${{ secrets.RRP_DB_NAME }}
          RRP_DB_USER: ${{ secrets.RRP_DB_USER }}
          RRP_DB_PASS: ${{ secrets.RRP_DB_PASS }}
        run: |
          set +x
          missing=0
          if [ -z "$RRP_DB_NAME" ]; then echo "Missing secret: RRP_DB_NAME"; missing=1; fi
          if [ -z "$RRP_DB_USER" ]; then echo "Missing secret: RRP_DB_USER"; missing=1; fi
          if [ -z "$RRP_DB_PASS" ]; then echo "Missing secret: RRP_DB_PASS"; missing=1; fi
          if [ "$missing" -ne 0 ]; then
            echo "Add those secrets under Settings → Secrets and variables → Actions, then re-run."
            exit 1
          fi
          echo "Required DB secrets are present (values not logged)."

      - name: Build config locally and install on Hostinger
        env:
          RRP_DB_NAME: ${{ secrets.RRP_DB_NAME }}
          RRP_DB_USER: ${{ secrets.RRP_DB_USER }}
          RRP_DB_PASS: ${{ secrets.RRP_DB_PASS }}
          RRP_MAIL_FROM: ${{ secrets.RRP_MAIL_FROM }}
        run: |
          set +x
          set -euo pipefail

          # Build PHP config on the runner — never cat/echo the file or password.
          python3 - <<'PY'
          import os
          from pathlib import Path
          from textwrap import dedent

          def php_str(value: str) -> str:
              return "'" + value.replace("\\", "\\\\").replace("'", "\\'") + "'"

          name = os.environ["RRP_DB_NAME"]
          user = os.environ["RRP_DB_USER"]
          password = os.environ["RRP_DB_PASS"]
          mail_from = (os.environ.get("RRP_MAIL_FROM") or "").strip() or "noreply@nakilab.com"

          content = dedent(f"""\
          <?php
          /**
           * RingRingPaw live config — outside web root.
           * Generated by GitHub Action "Setup RingRingPaw config". Do not commit.
           */
          declare(strict_types=1);

          return [
              'db' => [
                  'host' => 'localhost',
                  'port' => 3306,
                  'name' => {php_str(name)},
                  'user' => {php_str(user)},
                  'pass' => {php_str(password)},
                  'charset' => 'utf8mb4',
              ],
              'app_url' => 'https://ringringpaw.nakilab.com',
              'mail_from' => {php_str(mail_from)},
              'mail_from_name' => 'Ring Ring Paw',
              'smtp' => [
                  'enabled' => false,
                  'host' => 'smtp.hostinger.com',
                  'port' => 465,
                  'encryption' => 'ssl',
                  'user' => '',
                  'pass' => '',
              ],
              'session_name' => 'rrp_session',
              'live_ttl_seconds' => 30 * 60,
              'vapid' => [
                  'subject' => 'mailto:you@nakilab.com',
                  'public_key' => '',
                  'private_key' => '',
              ],
          ];
          """)
          path = Path("/tmp/ringringpaw.php")
          path.write_text(content, encoding="utf-8")
          path.chmod(0o600)
          PY

          # SSH key (same pattern as deploy-ringringpaw.yml) — never print key material
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > /tmp/rrp_deploy_key
          chmod 600 /tmp/rrp_deploy_key

          SSH=(ssh -i /tmp/rrp_deploy_key -p 65002 -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR)
          SCP=(scp -i /tmp/rrp_deploy_key -P 65002 -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR)
          HOST="u233722910@46.202.198.223"
          REMOTE_DIR="domains/nakilab.com/config"
          REMOTE_FILE="${REMOTE_DIR}/ringringpaw.php"

          "${SSH[@]}" "$HOST" "mkdir -p ${REMOTE_DIR} && chmod 700 ${REMOTE_DIR}"

          # Transfer file via scp (avoids embedding secrets in a remote shell heredoc / argv).
          "${SCP[@]}" /tmp/ringringpaw.php "${HOST}:${REMOTE_FILE}"
          "${SSH[@]}" "$HOST" "chmod 600 ${REMOTE_FILE} && test -f ${REMOTE_FILE} && test -s ${REMOTE_FILE} && echo Config_OK"

          rm -f /tmp/ringringpaw.php /tmp/rrp_deploy_key

          echo "Done. Server path: /home/u233722910/domains/nakilab.com/config/ringringpaw.php"
          echo "If not done yet: import sql/001_schema.sql in phpMyAdmin once."
