# Auto-deploy RingRingPaw: push to PetFinder → SSH git pull on Hostinger.
# Requires repo secret HOSTINGER_SSH_KEY (private deploy key; not the Mac key).
# Setup: docs/hostinger-deploy.md → "Your steps".
name: Deploy RingRingPaw

on:
  push:
    branches: [PetFinder]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH git pull on Hostinger
        run: |
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > key && chmod 600 key
          ssh -i key -p 65002 -o StrictHostKeyChecking=accept-new u233722910@46.202.198.223 \
            "cd domains/nakilab.com/public_html/ringringpaw && git pull --ff-only"
